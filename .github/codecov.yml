coverage:
  status:
    # Never let overall coverage slip; the project is at 82.76% today.
    project:
      default:
        target: auto
        threshold: 0.5%
    # New code is held above the current project average so coverage climbs.
    patch:
      default:
        target: 90%

comment: false
