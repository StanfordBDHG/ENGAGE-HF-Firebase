name: Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: |
          The GitHub deployment environment.
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
  workflow_call:
    inputs:
      environment:
        description: |
          The GitHub deployment environment.
        required: false
        type: string
        default: development

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  determineenvironment:
    name: Determine Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Determine Environment
        id: set-env
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          environment="${ENVIRONMENT:-staging}"
          case "$environment" in
            development|staging|production) ;;
            *) echo "::error::unsupported environment '$environment'"; exit 1 ;;
          esac
          printf 'environment=%s\n' "$environment" >> "$GITHUB_OUTPUT"
  vars:
    name: Inject Environment Variables In Deployment Workflow
    needs: determineenvironment
    runs-on: ubuntu-latest
    permissions: {}
    environment: ${{ needs.determineenvironment.outputs.environment }}
    outputs:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - run: |
          echo "Injecting Environment Variables In Deployment Workflow: ${{ vars.FIREBASE_PROJECT_ID }}"
  buildandtest:
    name: Build and Test
    needs: determineenvironment
    uses: ./.github/workflows/build-and-test.yml
    permissions:
      contents: read
      checks: write
    secrets: inherit
  deployfirebase:
    name: Deploy Firebase Project
    needs: [buildandtest, determineenvironment, vars]
    uses: SchmiedmayerLab/.github/.github/workflows/firebase-deploy.yml@v0.5
    permissions:
      contents: read
    with:
      customcommand: "npm run install"
      environment: ${{ needs.determineenvironment.outputs.environment }}
      arguments: '--project ${{ needs.vars.outputs.FIREBASE_PROJECT_ID }}'
    secrets:
      GOOGLE_APPLICATION_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_BASE64 }}
